<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Gesture Paint Dashboard</title>
    <style>
        body {
            margin: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: #0b0b0d;
            color: #f1f5f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        header {
            width: 100%;
            padding: 18px 0;
            background: rgba(20, 20, 25, 0.75);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        header h1 { 
            margin: 0; 
            font-size: 20px; 
            font-weight: 600;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #c084fc, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .main-container {
            display: flex;
            gap: 24px;
            padding: 32px;
            max-width: 1500px;
            width: 100%;
            box-sizing: border-box;
        }
        .feed-container {
            flex: 2.5;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.03);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .feed-container img {
            width: 100%;
            height: auto;
            display: block;
        }
        .controls-panel {
            flex: 1;
            background: rgba(22, 22, 28, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 28px;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
            display: flex;
            flex-direction: column;
            gap: 22px;
            height: fit-content;
        }
        .status-badge {
            background: rgba(168, 85, 247, 0.08);
            border: 1px solid rgba(168, 85, 247, 0.2);
            padding: 14px;
            border-radius: 10px;
            text-align: center;
            font-size: 14px;
            letter-spacing: 0.3px;
            font-weight: 500;
            color: #d8b4fe;
        }
        .status-badge span {
            font-weight: 600;
            color: #fff;
            margin-left: 4px;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        label { 
            font-size: 13px; 
            font-weight: 500;
            color: #94a3b8; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .color-picker-wrapper {
            position: relative;
            width: 100%;
            height: 44px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: #1e1e24;
            transition: border-color 0.2s;
        }
        .color-picker-wrapper:hover {
            border-color: rgba(168, 85, 247, 0.4);
        }
        input[type="color"] {
            position: absolute;
            top: -5px;
            left: -5px;
            width: calc(100% + 10px);
            height: calc(100% + 10px);
            border: none;
            cursor: pointer;
            background: none;
        }
        input[type="range"] {
            width: 100%;
            accent-color: #a855f7;
            height: 6px;
            background: #272730;
            border-radius: 4px;
            cursor: pointer;
        }
        .toggle-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            padding: 14px 16px;
            border-radius: 10px;
            transition: background 0.2s;
        }
        .toggle-group:hover {
            background: rgba(255, 255, 255, 0.04);
        }
        .toggle-group label {
            text-transform: none;
            font-size: 14px;
            color: #e2e8f0;
            letter-spacing: 0;
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 40px;
            height: 22px;
        }
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #3f3f46;
            transition: .3s;
            border-radius: 34px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: #a855f7;
        }
        input:checked + .slider:before {
            transform: translateX(18px);
        }
        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 5px;
        }
        .btn {
            background: rgba(255, 255, 255, 0.05);
            color: #f1f5f9;
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 12px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn:hover { 
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }
        .btn:active {
            transform: translateY(0);
        }
        .btn-danger { 
            grid-column: span 2;
            background: rgba(239, 68, 68, 0.1); 
            border-color: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            margin-top: 4px;
        }
        .btn-danger:hover { 
            background: rgba(239, 68, 68, 0.2);
            border-color: rgba(239, 68, 68, 0.4);
            color: #fff;
        }
    </style>
</head>
<body>

    <header>
        <h1>Gesture Canvas Controls</h1>
    </header>

    <div class="main-container">
        <!-- Live Video Element Source Window -->
        <div class="feed-container">
            <img src="/video_feed" alt="Live Gesture Video Stream">
        </div>

        <!-- UI Interactive Configuration Panel -->
        <div class="controls-panel">
            <div class="status-badge">
                CURRENT MODE:<span id="mode-text">Loading...</span>
            </div>

            <div class="control-group">
                <label>Brush Color</label>
                <div class="color-picker-wrapper">
                    <input type="color" id="colorPicker" value="#ff007f">
                </div>
            </div>

            <div class="control-group">
                <label>Brush Thickness</label>
                <input type="range" id="sizeSlider" min="2" max="50" value="5">
            </div>

            <div class="toggle-group">
                <label>Show Camera Stream</label>
                <label class="switch">
                    <input type="checkbox" id="camToggle" checked>
                    <span class="slider"></span>
                </label>
            </div>

            <div class="toggle-group">
                <label>Show Hand Skeleton</label>
                <label class="switch">
                    <input type="checkbox" id="skeletonToggle" checked>
                    <span class="slider"></span>
                </label>
            </div>

            <div class="toggle-group">
                <label>Isolate Hand Mode Only</label>
                <label class="switch">
                    <input type="checkbox" id="isolateHandToggle">
                    <span class="slider"></span>
                </label>
            </div>

            <hr style="border: none; border-top: 1px solid rgba(255, 255, 255, 0.06); margin: 8px 0;">

            <div class="action-grid">
                <button class="btn" onclick="sendAction('undo')">Undo</button>
                <button class="btn" onclick="sendAction('redo')">Redo</button>
                <button class="btn btn-danger" onclick="sendAction('clear')">Clear Canvas</button>
            </div>
        </div>
    </div>

    <script>
        // Update Configuration settings dynamically to the Flask backend instance
        function updateConfig() {
            const payload = {
                color: document.getElementById('colorPicker').value,
                size: document.getElementById('sizeSlider').value,
                show_camera: document.getElementById('camToggle').checked,
                show_skeleton: document.getElementById('skeletonToggle').checked,
                isolate_hand: document.getElementById('isolateHandToggle').checked
            };

            fetch('/set_config', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
        }

        // Trigger discrete canvas layout stack actions
        function sendAction(actionName) {
            fetch('/set_config', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: actionName })
            });
        }

        // Listen for immediate state input adjustments
        document.getElementById('colorPicker').addEventListener('input', updateConfig);
        document.getElementById('sizeSlider').addEventListener('input', updateConfig);
        document.getElementById('camToggle').addEventListener('change', updateConfig);
        document.getElementById('skeletonToggle').addEventListener('change', updateConfig);
        document.getElementById('isolateHandToggle').addEventListener('change', updateConfig);

        // Periodically ping state engine to update tracking display
        setInterval(() => {
            fetch('/get_mode')
                .then(res => res.json())
                .then(data => {
                    document.getElementById('mode-text').innerText = data.mode;
                })
                .catch(() => {});
        }, 300);
    </script>
</body>
</html>
